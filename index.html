<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Christmas Tree - Hand Interaction</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8E%84%3C/text%3E%3C/svg%3E">
    <style>
        body { 
            margin: 0; overflow: hidden; background-color: #000; 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; user-select: none;
        }

        /* 4:3 容器 */
        #canvas-wrapper {
            position: relative;
            box-shadow: 0 0 80px rgba(212, 175, 55, 0.15);
            background: #000;
            overflow: hidden;
            border-radius: 4px;
        }

        #canvas-container { width: 100%; height: 100%; display: block; }
        #canvas-container canvas { display: block; touch-action: none; cursor: grab; }
        #canvas-container canvas:active { cursor: grabbing; }

        /* 摄像头窗口 */
        #video-container {
            position: absolute; top: 20px; right: 20px; width: 160px; height: 120px; z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; overflow: hidden;
            transform: scaleX(-1); /* 镜像翻转 */
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            background: rgba(0,0,0,0.8);
            transition: opacity 0.5s ease;
            opacity: 0; pointer-events: none;
        }
        #video-container.active { opacity: 1; }
        #input-video { 
            width: 100%; height: 100%; object-fit: cover; opacity: 0.5; 
            position: absolute; top: 0; left: 0;
        }
        #skeleton-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
        }

        /* UI 层 */
        #ui-layer {
            position: absolute; top: 40px; left: 40px; z-index: 3; pointer-events: none;
            color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            transition: opacity 0.5s;
        }

        h1 {
            font-weight: 200; letter-spacing: 6px; text-transform: uppercase; font-size: 2rem; margin: 0 0 15px 0;
            background: linear-gradient(to right, #fff, #ffd700, #fff); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .instructions {
            font-size: 0.85rem; color: #ccc; line-height: 1.8; max-width: 300px;
            background: rgba(10, 10, 10, 0.6); padding: 20px; border-radius: 12px;
            border-left: 2px solid #d4af37; backdrop-filter: blur(8px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .highlight { color: #d4af37; font-weight: 600; padding: 0 4px; }
        #status-text { margin-bottom: 12px; font-size: 1.1rem; color: #fff; font-weight: 500; display: flex; align-items: center; gap: 8px;}
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; display: inline-block; flex: none;}

        /* 按钮 */
        #action-bar { pointer-events: auto; display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
        .action-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 12px 26px; cursor: pointer; text-transform: uppercase;
            font-size: 0.75rem; transition: all 0.3s ease;
            letter-spacing: 2px; border-radius: 30px;
        }
        .action-btn:hover:not(:disabled) { background: #fff; color: #000; box-shadow: 0 0 25px rgba(255,255,255,0.4); }
        .action-btn:disabled { opacity: 0.55; cursor: default; }
        #file-input { display: none; }
        
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #d4af37; font-size: 1rem; letter-spacing: 4px; z-index: 10; 
            pointer-events: none; transition: opacity 0.5s; font-weight: 300;
        }

        /* 沉浸模式切换 */
        #fullscreen-btn {
            position: absolute; bottom: 30px; right: 30px; z-index: 20;
            background: rgba(0,0,0,0.3); color: #d4af37; border: 1px solid rgba(212, 175, 55, 0.3);
            width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; transition: all 0.3s;
            backdrop-filter: blur(4px);
        }
        #fullscreen-btn:hover { background: #d4af37; color: #000; border-color: #d4af37; }

        /* 隐藏 UI 状态 */
        .hide-ui #ui-layer, 
        .hide-ui #video-container { 
            opacity: 0 !important; pointer-events: none; 
        }
        .hide-ui #fullscreen-btn { opacity: 0.5; }
        .hide-ui #fullscreen-btn:hover { opacity: 1; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "./vendor/three/build/three.module.js",
                "three/addons/": "./vendor/three/addons/"
            }
        }
    </script>
</head>
<body>

    <div id="canvas-wrapper">
        <div id="canvas-container"></div>
        
        <div id="video-container">
            <video id="input-video" autoplay playsinline muted></video>
            <canvas id="skeleton-canvas"></canvas>
        </div>

        <button id="fullscreen-btn" onclick="toggleUI()" title="切换沉浸模式">⛶</button>

        <div id="ui-layer">
            <h1>Merry Christmas</h1>
            <div id="status-text"><span class="status-dot" id="status-dot"></span><span id="status-msg">初始化引擎...</span></div>
            <div class="instructions">
                • <span class="highlight">握拳</span> : 聚合圣诞树<br/>
                • <span class="highlight">张手</span> : 星云散开<br/>
                • <span class="highlight">挥动</span> : 旋转视图 (仅散开时)<br/>
                • <span class="highlight">捏合</span> : 聚焦照片<br/>
                • <span class="highlight">拖动</span> : 鼠标/触控旋转<br/>
                • <span class="highlight">上传</span> : 照片环绕成背景
            </div>
            <div id="action-bar">
                <button id="upload-btn" class="action-btn" onclick="document.getElementById('file-input').click()">上传纪念照片</button>
                <button id="gesture-btn" class="action-btn">开启手势</button>
            </div>
            <input type="file" id="file-input" multiple accept="image/*">
        </div>
        <div id="loading">CRAFTING MAGIC...</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        const CONFIG = {
            goldCount: 500,
            silverCount: 500,
            gemCount: 300,
            emeraldCount: 300,
            dustCount: 1000,
            treeHeight: 75,
            maxRadius: 30,
            camDistance: 110,
            bloomStrength: 0.7,
            bloomThreshold: 0.35,
            bloomRadius: 0.6,
            // 照片环
            ringRadius: 150,
            ringPhotoSize: 42,
            ringSpeed: 0.08,
            maxPhotos: 24,
            // 雪
            snowCount: 900,
            snowArea: 340,
            snowTop: 160,
            snowBottom: -140,
            snowSpeed: 8,
            snowSize: 3.0
        };

        const STATE = { TREE: 'tree', SCATTER: 'scatter', ZOOM: 'zoom' };
        let currentState = STATE.TREE;

        let scene, camera, renderer, composer, bloomPass;
        const mainGroup = new THREE.Group();
        const photoRing = new THREE.Group();
        let goldMesh, silverMesh, gemMesh, emeraldMesh, dustSystem, snowSystem;
        let goldMat, silverMat, gemMat, emeraldMat;
        let maskTarget;
        const maskMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, fog: false });
        let photoMeshes = [];
        let zoomTargetIndex = -1;

        let logicData = { gold: [], silver: [], gem: [], emerald: [], dust: [], star: null };
        const dummy = new THREE.Object3D();
        const _tempVec3 = new THREE.Vector3();
        let time = 0;
        const clock = new THREE.Clock();

        let handPos = { x: 0, y: 0 };
        let lastHandPos = { x: 0, y: 0 };
        let isHandPresent = false;
        let lastFrameHadHand = false;
        let rotationVelocity = { x: 0, y: 0 };

        let gestureActive = false;
        let gestureStarting = false;
        let handLandmarkerInstance = null;
        let lastVideoTime = -1;
        let lastPredictionTime = 0;
        const PREDICTION_INTERVAL = 50;

        let pointerDown = false;
        let pointerMoved = false;
        let lastPointer = { x: 0, y: 0 };
        const raycaster = new THREE.Raycaster();
        raycaster.layers.enable(2);
        const pointerNdc = new THREE.Vector2();

        window.toggleUI = function() {
            document.getElementById('canvas-wrapper').classList.toggle('hide-ui');
        };

        function updateStatus(msg, color = '#fff') {
            document.getElementById('status-msg').innerHTML = msg;
            document.getElementById('status-dot').style.background = color;
        }

        function initThree() {
            const wrapper = document.getElementById('canvas-wrapper');
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505); 
            scene.fog = new THREE.FogExp2(0x050505, 0.002);

            updateDimensions();

            camera = new THREE.PerspectiveCamera(50, wrapper.clientWidth / wrapper.clientHeight, 0.1, 1000);
            camera.position.set(0, 0, CONFIG.camDistance);
            camera.layers.enable(2); // 照片单独放在第 2 层，用于泛光遮罩

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance", stencil: false });
            renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1;
            container.appendChild(renderer.domElement);

            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
            scene.add(ambientLight);

            const spotLight = new THREE.SpotLight(0xffddaa, 100);
            spotLight.position.set(30, 80, 50);
            spotLight.angle = Math.PI / 4;
            spotLight.penumbra = 1;
            scene.add(spotLight);

            const blueLight = new THREE.PointLight(0x4488ff, 50, 200);
            blueLight.position.set(-40, -20, 40);
            scene.add(blueLight);
            
            const renderScene = new RenderPass(scene, camera);
            bloomPass = new UnrealBloomPass(new THREE.Vector2(wrapper.clientWidth, wrapper.clientHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = CONFIG.bloomThreshold;
            bloomPass.strength = CONFIG.bloomStrength;
            bloomPass.radius = CONFIG.bloomRadius;
            setupPhotoMaskBloom();

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            createMaterialsAndMeshes();
            createDust();
            createStarField();
            createSnow();

            scene.add(mainGroup);
            scene.add(photoRing);

            setupPointerControls();
            document.getElementById('gesture-btn').addEventListener('click', startGesture);
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => { if (e.key === 'Escape') exitZoom(); });

            document.getElementById('loading').style.display = 'none';
            updateStatus('拖动旋转 · 上传照片环绕背景', '#d4af37');
        }

        function setupPhotoMaskBloom() {
            const bufferSize = renderer.getDrawingBufferSize(new THREE.Vector2());
            maskTarget = new THREE.WebGLRenderTarget(
                Math.max(1, Math.round(bufferSize.x / 2)),
                Math.max(1, Math.round(bufferSize.y / 2))
            );
            maskTarget.texture.generateMipmaps = false;

            bloomPass.materialHighPassFilter.uniforms.maskMap = { value: maskTarget.texture };
            bloomPass.materialHighPassFilter.fragmentShader = bloomPass.materialHighPassFilter.fragmentShader
                .replace('uniform sampler2D tDiffuse;', 'uniform sampler2D tDiffuse;\n\t\t\tuniform sampler2D maskMap;')
                .replace('float v = dot( texel.xyz, luma );', 'float v = dot( texel.xyz, luma ) * ( 1.0 - texture2D( maskMap, vUv ).r );');
            bloomPass.materialHighPassFilter.needsUpdate = true;

            renderer.setRenderTarget(maskTarget);
            renderer.setClearColor(0x000000, 1);
            renderer.clear();
            renderer.setRenderTarget(null);
        }

        function renderPhotoMask() {
            if (photoMeshes.length === 0) return;

            const prevBackground = scene.background;
            const prevOverride = scene.overrideMaterial;
            const prevLayers = camera.layers.mask;

            scene.background = null;
            scene.overrideMaterial = maskMaterial;
            camera.layers.set(2);

            renderer.setRenderTarget(maskTarget);
            renderer.clear();
            renderer.render(scene, camera);
            renderer.setRenderTarget(null);

            camera.layers.mask = prevLayers;
            scene.overrideMaterial = prevOverride;
            scene.background = prevBackground;
        }

        function updateDimensions() {
            const targetAspect = 4 / 3;
            const windowAspect = window.innerWidth / window.innerHeight;
            let width, height;

            if (windowAspect > targetAspect) {
                height = window.innerHeight;
                width = height * targetAspect;
            } else {
                width = window.innerWidth;
                height = width / targetAspect;
            }

            const wrapper = document.getElementById('canvas-wrapper');
            wrapper.style.width = width + 'px';
            wrapper.style.height = height + 'px';
            return { width, height };
        }

        function createMaterialsAndMeshes() {
            goldMat = new THREE.MeshPhysicalMaterial({
                color: 0xffaa00, metalness: 1.0, roughness: 0.15, clearcoat: 1.0, emissive: 0xaa5500, emissiveIntensity: 0.1,
                transparent: true
            });
            silverMat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff, metalness: 0.9, roughness: 0.2, clearcoat: 1.0, transparent: true
            });
            gemMat = new THREE.MeshPhysicalMaterial({
                color: 0xff0044, metalness: 0.1, roughness: 0.0, transmission: 0.6, thickness: 1.5, emissive: 0x550011, emissiveIntensity: 0.4,
                transparent: true
            });
            emeraldMat = new THREE.MeshPhysicalMaterial({
                color: 0x00aa55, metalness: 0.2, roughness: 0.1, transmission: 0.5, thickness: 1.5, emissive: 0x002211, emissiveIntensity: 0.3,
                transparent: true
            });

            goldMesh = createInstancedMesh(new THREE.SphereGeometry(0.7, 12, 12), goldMat, CONFIG.goldCount, logicData.gold);
            silverMesh = createInstancedMesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), silverMat, CONFIG.silverCount, logicData.silver);
            gemMesh = createInstancedMesh(new THREE.OctahedronGeometry(0.8, 0), gemMat, CONFIG.gemCount, logicData.gem);
            emeraldMesh = createInstancedMesh(new THREE.ConeGeometry(0.5, 1.2, 6), emeraldMat, CONFIG.emeraldCount, logicData.emerald);

            const starGeo = new THREE.OctahedronGeometry(3.0, 0);
            const starMat = new THREE.MeshPhysicalMaterial({ 
                color: 0xffffff, metalness:0.8, roughness:0, emissive:0xffffee, emissiveIntensity:1.5 
            });
            const star = new THREE.Mesh(starGeo, starMat);
            star.userData = { 
                treePos: new THREE.Vector3(0, CONFIG.treeHeight/2 + 2.5, 0), 
                scatterPos: new THREE.Vector3(0, 60, 0) 
            };
            star.position.copy(star.userData.treePos);
            mainGroup.add(star);
            logicData.star = star;
        }

        function createInstancedMesh(geo, mat, count, dataArray) {
            const mesh = new THREE.InstancedMesh(geo, mat, count);
            mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            mainGroup.add(mesh);
            
            for (let i = 0; i < count; i++) {
                const h = Math.random() * CONFIG.treeHeight - CONFIG.treeHeight/2;
                const normH = (h + CONFIG.treeHeight/2) / CONFIG.treeHeight;
                const rMax = CONFIG.maxRadius * (1 - normH) * 1.1; 
                
                const r = Math.sqrt(Math.random()) * rMax; 
                const theta = Math.random() * Math.PI * 2;
                
                const treePos = new THREE.Vector3(r * Math.cos(theta), h, r * Math.sin(theta));
                const scatterPos = randomSpherePoint(40 + Math.random()*50);

                dataArray.push({
                    treePos: treePos,
                    scatterPos: scatterPos,
                    currentPos: treePos.clone(),
                    scale: 0.5 + Math.random() * 0.9,
                    rotSpeed: new THREE.Euler(Math.random()*0.02, Math.random()*0.02, 0),
                    rotation: new THREE.Euler(Math.random()*Math.PI, Math.random()*Math.PI, 0)
                });
            }
            return mesh;
        }

        function randomSpherePoint(r) {
            const u = Math.random(), v = Math.random();
            const theta = 2 * Math.PI * u;
            const phi = Math.acos(2 * v - 1);
            return new THREE.Vector3(
                r * Math.sin(phi) * Math.cos(theta), 
                r * Math.sin(phi) * Math.sin(theta), 
                r * Math.cos(phi)
            );
        }

        function createDust() {
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(CONFIG.dustCount * 3);
            
            for(let i=0; i<CONFIG.dustCount; i++) {
                const h = Math.random() * CONFIG.treeHeight - CONFIG.treeHeight/2;
                const r = Math.random() * CONFIG.maxRadius + 5;
                const theta = Math.random() * Math.PI * 2;
                
                const x = r*Math.cos(theta);
                const z = r*Math.sin(theta);
                
                pos[i*3] = x; pos[i*3+1] = h; pos[i*3+2] = z;
                
                logicData.dust.push({
                    treePos: new THREE.Vector3(x, h, z),
                    scatterPos: randomSpherePoint(70),
                    currentPos: new THREE.Vector3(x, h, z),
                    velocity: (Math.random() * 0.05 + 0.02) * 60
                });
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            
            const mat = new THREE.PointsMaterial({ 
                color: 0xffd700, size: 0.5, transparent: true, opacity: 0.4, 
                blending: THREE.AdditiveBlending, depthWrite: false 
            });
            dustSystem = new THREE.Points(geo, mat);
            mainGroup.add(dustSystem);
        }

        function createStarField() {
            const geo = new THREE.BufferGeometry();
            const pos = [];
            for(let i=0; i<800; i++) {
                pos.push((Math.random()-0.5)*800, (Math.random()-0.5)*800, (Math.random()-0.5)*800);
            }
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            const stars = new THREE.Points(geo, new THREE.PointsMaterial({color: 0x666666, size: 1.0, transparent: true, opacity: 0.6}));
            scene.add(stars);
        }

        function createSnowflakeTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.translate(32, 32);

            const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, 30);
            glow.addColorStop(0, 'rgba(255,255,255,0.55)');
            glow.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(0, 0, 30, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.9)';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            for (let i = 0; i < 6; i++) {
                ctx.rotate(Math.PI / 3);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, -24);
                ctx.moveTo(0, -10);
                ctx.lineTo(5, -15);
                ctx.moveTo(0, -17);
                ctx.lineTo(-5, -22);
                ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createSnow() {
            const count = CONFIG.snowCount;
            const positions = new Float32Array(count * 3);
            const speeds = new Float32Array(count);
            const phases = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                positions[i*3] = (Math.random() - 0.5) * CONFIG.snowArea;
                positions[i*3+1] = CONFIG.snowBottom + Math.random() * (CONFIG.snowTop - CONFIG.snowBottom);
                positions[i*3+2] = (Math.random() - 0.5) * CONFIG.snowArea;
                speeds[i] = CONFIG.snowSpeed * (0.45 + Math.random() * 0.9);
                phases[i] = Math.random() * Math.PI * 2;
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const mat = new THREE.PointsMaterial({
                map: createSnowflakeTexture(),
                color: 0xe8f0ff,
                size: CONFIG.snowSize,
                transparent: true,
                opacity: 0.9,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true
            });

            snowSystem = new THREE.Points(geo, mat);
            snowSystem.userData = { speeds, phases };
            scene.add(snowSystem);
        }

        function updateSnow(dt) {
            const positions = snowSystem.geometry.attributes.position.array;
            const { speeds, phases } = snowSystem.userData;

            for (let i = 0; i < speeds.length; i++) {
                const iy = i * 3 + 1;
                positions[iy] -= speeds[i] * dt;
                positions[i*3] += Math.sin(time * 0.7 + phases[i]) * 5 * dt;

                if (positions[iy] < CONFIG.snowBottom) {
                    positions[iy] = CONFIG.snowTop;
                    positions[i*3] = (Math.random() - 0.5) * CONFIG.snowArea;
                    positions[i*3+2] = (Math.random() - 0.5) * CONFIG.snowArea;
                }
            }
            snowSystem.geometry.attributes.position.needsUpdate = true;
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            time += dt;

            updateMeshLogic(goldMesh, logicData.gold, dt);
            updateMeshLogic(silverMesh, logicData.silver, dt);
            updateMeshLogic(gemMesh, logicData.gem, dt);
            updateMeshLogic(emeraldMesh, logicData.emerald, dt);
            updateDustLogic(dt);
            updateRingPhotos(dt);
            updateSnow(dt);
            
            if (logicData.star) {
                let target = currentState === STATE.TREE ? logicData.star.userData.treePos : logicData.star.userData.scatterPos;
                logicData.star.position.lerp(target, 1 - Math.pow(0.95, dt * 60));
                logicData.star.rotation.y += 0.6 * dt;
            }

            handlePhysicsRotation(dt);

            // 聚焦照片时压低树体粒子，减少对照片的干扰
            const dimK = 1 - Math.pow(0.88, dt * 60);
            const zooming = currentState === STATE.ZOOM;
            const treeOpacity = zooming ? 0.22 : 1;
            goldMat.opacity = THREE.MathUtils.lerp(goldMat.opacity, treeOpacity, dimK);
            silverMat.opacity = THREE.MathUtils.lerp(silverMat.opacity, treeOpacity, dimK);
            gemMat.opacity = THREE.MathUtils.lerp(gemMat.opacity, treeOpacity, dimK);
            emeraldMat.opacity = THREE.MathUtils.lerp(emeraldMat.opacity, treeOpacity, dimK);
            dustSystem.material.opacity = THREE.MathUtils.lerp(dustSystem.material.opacity, zooming ? 0.1 : 0.4, dimK);

            renderPhotoMask();
            composer.render();
        }

        function handlePhysicsRotation(dt) {
            const damp = Math.exp(-2.2 * dt);
            if (currentState === STATE.ZOOM) {
                rotationVelocity.x *= Math.exp(-6 * dt);
                rotationVelocity.y *= Math.exp(-6 * dt);
                return;
            }

            const autoSpin = currentState === STATE.TREE ? 0.24 * dt : 0;
            mainGroup.rotation.y += rotationVelocity.y * dt + autoSpin;
            mainGroup.rotation.x += rotationVelocity.x * dt;

            rotationVelocity.y *= damp;
            rotationVelocity.x *= damp;
            mainGroup.rotation.x *= Math.exp(-0.35 * dt);
        }

        function clampVelocity() {
            rotationVelocity.x = THREE.MathUtils.clamp(rotationVelocity.x, -3, 3);
            rotationVelocity.y = THREE.MathUtils.clamp(rotationVelocity.y, -3, 3);
        }

        function updateMeshLogic(mesh, dataArray, dt) {
            const isZoom = currentState === STATE.ZOOM;
            const isTree = currentState === STATE.TREE;
            const f = dt * 60;
            const k = 1 - Math.pow(0.92, f);

            for (let i = 0; i < dataArray.length; i++) {
                const item = dataArray[i];
                let target = isTree ? item.treePos : item.scatterPos;
                if (isZoom) target = item.scatterPos;

                if (!isTree) item.currentPos.y += Math.sin(time + i * 0.1) * 0.01 * f;
                item.currentPos.lerp(target, k);
                
                item.rotation.x += item.rotSpeed.x * f;
                item.rotation.y += item.rotSpeed.y * f;

                let s = item.scale;
                if (isZoom) s *= 0.5;

                dummy.position.copy(item.currentPos);
                dummy.rotation.copy(item.rotation);
                dummy.scale.setScalar(s);
                dummy.updateMatrix();
                mesh.setMatrixAt(i, dummy.matrix);
            }
            mesh.instanceMatrix.needsUpdate = true;
        }

        function updateDustLogic(dt) {
            const positions = dustSystem.geometry.attributes.position.array;
            const isTree = currentState === STATE.TREE;
            const k = 1 - Math.pow(0.95, dt * 60);

            for(let i=0; i<logicData.dust.length; i++) {
                const item = logicData.dust[i];
                
                if (isTree) {
                    item.currentPos.y += item.velocity * dt;
                    if(item.currentPos.y > CONFIG.treeHeight/2) item.currentPos.y = -CONFIG.treeHeight/2;
                    
                    const rMax = CONFIG.maxRadius * (1 - (item.currentPos.y + CONFIG.treeHeight/2)/CONFIG.treeHeight) + 5;
                    const rCurr = Math.sqrt(item.currentPos.x**2 + item.currentPos.z**2);
                    if(rCurr > rMax) {
                        item.currentPos.x *= 0.95;
                        item.currentPos.z *= 0.95;
                    }
                } else {
                    item.currentPos.lerp(item.scatterPos, k);
                }

                positions[i*3] = item.currentPos.x;
                positions[i*3+1] = item.currentPos.y;
                positions[i*3+2] = item.currentPos.z;
            }
            dustSystem.geometry.attributes.position.needsUpdate = true;
        }

        function makePhotoTexture(img, maxSize = 640) {
            const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
            return tex;
        }

        let hiResOwner = null;

        function releaseHiResTexture(mesh) {
            const d = mesh.userData;
            if (!d.hiResLoaded) return;
            if (d.photoMat.map !== d.thumbTex) d.photoMat.map.dispose();
            d.photoMat.map = d.thumbTex;
            d.photoMat.needsUpdate = true;
            d.hiResLoaded = false;
        }

        function ensureHiResTexture(mesh) {
            const d = mesh.userData;
            if (d.hiResLoaded || !d.file) return;
            if (hiResOwner && hiResOwner !== mesh) releaseHiResTexture(hiResOwner);
            hiResOwner = mesh;
            d.hiResLoaded = true;

            const url = URL.createObjectURL(d.file);
            const img = new Image();
            img.onload = () => {
                if (hiResOwner !== mesh) {
                    URL.revokeObjectURL(url);
                    return;
                }
                const maxSize = Math.min(2048, renderer.capabilities.maxTextureSize);
                const tex = makePhotoTexture(img, maxSize);
                if (d.photoMat.map !== d.thumbTex) d.photoMat.map.dispose();
                d.photoMat.map = tex;
                d.photoMat.needsUpdate = true;
                URL.revokeObjectURL(url);
            };
            img.onerror = () => URL.revokeObjectURL(url);
            img.src = url;
        }

        function addRingPhoto(img, file) {
            const aspect = img.width / img.height;
            const base = CONFIG.ringPhotoSize;
            const w = aspect >= 1 ? base : base * aspect;
            const h = aspect >= 1 ? base / aspect : base;

            const thumbTex = makePhotoTexture(img);
            const photoMat = new THREE.MeshBasicMaterial({
                map: thumbTex, transparent: true, side: THREE.DoubleSide, fog: false
            });
            const frameMat = new THREE.MeshPhysicalMaterial({
                color: 0xffd27a, metalness: 1, roughness: 0.25, transparent: true, fog: false
            });

            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), photoMat);
            mesh.layers.set(2);
            const frame = new THREE.Mesh(new THREE.BoxGeometry(w + 1.2, h + 1.2, 0.4), frameMat);
            frame.position.z = -0.25;
            frame.layers.set(2);
            mesh.add(frame);

            mesh.userData = {
                angle: 0,
                radius: CONFIG.ringRadius,
                y: 0,
                baseScale: 1,
                tilt: 0,
                file,
                thumbTex,
                hiResLoaded: false,
                overlay: false,
                placed: false,
                photoMat,
                frameMat
            };
            mesh.position.set(0, 0, -CONFIG.ringRadius * 1.45);
            photoMeshes.push(mesh);
            photoRing.add(mesh);
        }

        function layoutRingPhotos() {
            const n = photoMeshes.length;
            photoMeshes.forEach((mesh, i) => {
                const band = i % 2;
                mesh.userData.angle = -Math.PI / 2 + (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.12;
                mesh.userData.radius = CONFIG.ringRadius + (band ? 22 : 0) + (Math.random() - 0.5) * 46;
                mesh.userData.y = (band ? 1 : -1) * (28 + Math.random() * 18);
                mesh.userData.baseScale = 0.88 + Math.random() * 0.24;
                mesh.userData.tilt = (Math.random() - 0.5) * 0.12;

                if (!mesh.userData.placed) {
                    mesh.userData.placed = true;
                    const angle = mesh.userData.angle;
                    const radius = mesh.userData.radius * 1.45;
                    mesh.position.set(Math.cos(angle) * radius, mesh.userData.y, Math.sin(angle) * radius);
                }
            });
        }

        function updateRingPhotos(dt) {
            if (photoMeshes.length === 0) return;

            const inZoom = currentState === STATE.ZOOM;
            const hasTarget = inZoom && zoomTargetIndex >= 0 && zoomTargetIndex < photoMeshes.length;
            photoRing.rotation.y += CONFIG.ringSpeed * (inZoom ? 0.08 : 1) * dt;

            const k = 1 - Math.pow(0.001, dt);

            for (let i = 0; i < photoMeshes.length; i++) {
                const mesh = photoMeshes[i];
                const d = mesh.userData;
                const isTarget = hasTarget && i === zoomTargetIndex;

                let scaleFactor = 1;
                let opacity = 1;

                if (isTarget !== d.overlay) {
                    d.overlay = isTarget;
                    d.photoMat.depthTest = !isTarget;
                    d.photoMat.depthWrite = !isTarget;
                    d.frameMat.depthTest = !isTarget;
                    d.frameMat.depthWrite = !isTarget;
                    mesh.renderOrder = isTarget ? 20 : 0;
                    mesh.children.forEach((child) => { child.renderOrder = isTarget ? 19 : 0; });
                }

                if (isTarget) {
                    _tempVec3.set(0, 0, -80).applyMatrix4(camera.matrixWorld);
                    photoRing.worldToLocal(_tempVec3);
                    mesh.position.lerp(_tempVec3, k);
                    scaleFactor = 1.6;
                } else {
                    const y = d.y + Math.sin(time * 0.6 + i * 1.7) * 1.2;
                    _tempVec3.set(Math.cos(d.angle) * d.radius, y, Math.sin(d.angle) * d.radius);
                    mesh.position.lerp(_tempVec3, k);
                    if (inZoom) { scaleFactor = 0.8; opacity = 0.25; }
                }

                mesh.lookAt(camera.position);
                if (d.tilt) mesh.rotateZ(d.tilt);

                const s = d.baseScale * scaleFactor;
                mesh.scale.setScalar(THREE.MathUtils.lerp(mesh.scale.x, s, k));

                d.photoMat.opacity = THREE.MathUtils.lerp(d.photoMat.opacity, opacity, k);
                d.frameMat.opacity = THREE.MathUtils.lerp(d.frameMat.opacity, opacity * 0.9, k);
            }
        }

        function exitZoom() {
            if (currentState !== STATE.ZOOM) return;
            currentState = STATE.SCATTER;
            zoomTargetIndex = -1;
            updateStatus('点击空白/张手：星云散开', '#00aaff');
        }

        function switchToZoom() {
            if (currentState !== STATE.SCATTER || photoMeshes.length === 0) return;
            let minDist = Infinity;
            let bestIdx = 0;
            const worldPos = new THREE.Vector3();

            photoMeshes.forEach((mesh, idx) => {
                mesh.getWorldPosition(worldPos);
                const d = worldPos.distanceTo(camera.position);
                if (d < minDist) {
                    minDist = d;
                    bestIdx = idx;
                }
            });

            zoomTargetIndex = bestIdx;
            currentState = STATE.ZOOM;
            ensureHiResTexture(photoMeshes[bestIdx]);
        }

        function setupPointerControls() {
            const el = renderer.domElement;

            el.addEventListener('pointerdown', (e) => {
                pointerDown = true;
                pointerMoved = false;
                lastPointer.x = e.clientX;
                lastPointer.y = e.clientY;
                try { el.setPointerCapture(e.pointerId); } catch (err) { /* 部分浏览器/合成事件不支持捕获 */ }
            });

            el.addEventListener('pointermove', (e) => {
                if (!pointerDown) return;
                const dx = e.clientX - lastPointer.x;
                const dy = e.clientY - lastPointer.y;
                if (Math.abs(dx) + Math.abs(dy) > 2) pointerMoved = true;
                lastPointer.x = e.clientX;
                lastPointer.y = e.clientY;

                if (currentState !== STATE.ZOOM) {
                    rotationVelocity.y += dx * 0.008;
                    rotationVelocity.x += dy * 0.004;
                    clampVelocity();
                }
            });

            el.addEventListener('pointerup', (e) => {
                if (!pointerDown) return;
                pointerDown = false;
                try { el.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
                if (!pointerMoved) handleCanvasClick(e);
            });

            el.addEventListener('pointercancel', () => { pointerDown = false; });
        }

        function handleCanvasClick(event) {
            if (photoMeshes.length === 0) return;

            const rect = renderer.domElement.getBoundingClientRect();
            pointerNdc.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            pointerNdc.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointerNdc, camera);

            const hits = raycaster.intersectObjects(photoMeshes, false);
            if (hits.length > 0) {
                const idx = photoMeshes.indexOf(hits[0].object);
                if (idx >= 0) {
                    zoomTargetIndex = idx;
                    currentState = STATE.ZOOM;
                    ensureHiResTexture(photoMeshes[idx]);
                    updateStatus('聚焦照片（点击空白处返回）', '#ffd700');
                }
            } else if (currentState === STATE.ZOOM) {
                exitZoom();
            }
        }

        async function startGesture() {
            if (gestureActive || gestureStarting) return;
            gestureStarting = true;
            const btn = document.getElementById('gesture-btn');
            btn.disabled = true;
            btn.textContent = '模型加载中…';
            updateStatus('正在加载本地视觉模型…', '#ffd60a');

            try {
                let landmarker = handLandmarkerInstance;
                if (!landmarker) {
                    const visionLib = await import('./vendor/mediapipe/vision_bundle.js');
                    const vision = await visionLib.FilesetResolver.forVisionTasks('./vendor/mediapipe/wasm');
                    const options = (delegate) => ({
                        baseOptions: {
                            modelAssetPath: './vendor/models/hand_landmarker.task',
                            delegate
                        },
                        runningMode: 'VIDEO',
                        numHands: 1
                    });

                    try {
                        landmarker = await visionLib.HandLandmarker.createFromOptions(vision, options('GPU'));
                    } catch (gpuError) {
                        console.warn('GPU delegate unavailable, falling back to CPU.', gpuError);
                        landmarker = await visionLib.HandLandmarker.createFromOptions(vision, options('CPU'));
                    }
                    handLandmarkerInstance = landmarker;
                }

                const video = document.getElementById('input-video');
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
                } catch (camError) {
                    const wrapped = new Error('CAMERA:' + (camError?.name || 'ERROR'));
                    wrapped.cause = camError;
                    throw wrapped;
                }
                video.srcObject = stream;
                await video.play().catch(() => {});
                document.getElementById('video-container').classList.add('active');

                gestureActive = true;
                gestureStarting = false;
                btn.disabled = false;
                btn.textContent = '手势已开启';
                updateStatus('系统就绪，请伸手（也可拖动旋转）', '#39d353');

                if (video.readyState >= 2) predictWebcam(landmarker, video);
                else video.addEventListener('loadeddata', () => predictWebcam(landmarker, video), { once: true });
            } catch (error) {
                console.warn('Gesture setup failed:', error);
                const cameraDenied = typeof error?.message === 'string' && error.message.startsWith('CAMERA:');
                gestureStarting = false;
                btn.disabled = false;
                btn.textContent = cameraDenied ? '重试摄像头' : '开启手势';
                updateStatus(cameraDenied ? '未获得摄像头权限，已切换拖动旋转' : '视觉模型不可用，已切换拖动旋转', '#ffa94d');
            }
        }

        function predictWebcam(handLandmarker, video) {
            if (!gestureActive) return;
            requestAnimationFrame(() => predictWebcam(handLandmarker, video));

            const now = performance.now();
            if (video.currentTime === lastVideoTime || now - lastPredictionTime < PREDICTION_INTERVAL) return;
            lastVideoTime = video.currentTime;
            lastPredictionTime = now;

            try {
                const result = handLandmarker.detectForVideo(video, now);
                drawAndProcess(video, result);
            } catch (error) {
                console.warn('Hand detection stopped:', error);
                gestureActive = false;
                updateStatus('手势识别异常，请拖动旋转', '#ffa94d');
            }
        }
        
        function drawAndProcess(video, result) {
            const canvas = document.getElementById('skeleton-canvas');
            const ctx = canvas.getContext('2d');
            
            if(canvas.width !== video.videoWidth) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (result.landmarks && result.landmarks.length > 0) {
                const landmarks = result.landmarks[0];
                isHandPresent = true;
                drawSkeleton(ctx, landmarks, canvas.width, canvas.height);
                handleGesture(landmarks);
            } else {
                isHandPresent = false;
                lastFrameHadHand = false;
            }
        }

        function drawSkeleton(ctx, landmarks, w, h) {
            ctx.lineWidth = 3; ctx.strokeStyle = '#00ff88'; ctx.fillStyle = '#ff0044';
            const connections = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
            
            ctx.beginPath();
            for (let c of connections) {
                const s = landmarks[c[0]];
                const e = landmarks[c[1]];
                ctx.moveTo(s.x * w, s.y * h); ctx.lineTo(e.x * w, e.y * h);
            }
            ctx.stroke();
            
            for(let p of landmarks) {
                ctx.beginPath(); ctx.arc(p.x * w, p.y * h, 3, 0, 2 * Math.PI); ctx.fill();
            }
        }

        function handleGesture(landmarks) {
            const palmX = 1 - (landmarks[0].x + landmarks[9].x) / 2;
            const palmY = (landmarks[0].y + landmarks[9].y) / 2;
            
            handPos.x = handPos.x * 0.7 + palmX * 0.3;
            handPos.y = handPos.y * 0.7 + palmY * 0.3;

            if (!lastFrameHadHand) {
                lastHandPos.x = handPos.x;
                lastHandPos.y = handPos.y;
                lastFrameHadHand = true;
            } else if (isHandPresent && currentState === STATE.SCATTER) {
                const deltaX = handPos.x - lastHandPos.x;
                const deltaY = handPos.y - lastHandPos.y;

                if (Math.abs(deltaX) > 0.001) rotationVelocity.y += deltaX * 8;
                if (Math.abs(deltaY) > 0.001) rotationVelocity.x += deltaY * 4;
                clampVelocity();

                lastHandPos.x = handPos.x;
                lastHandPos.y = handPos.y;
            }

            let folded = 0;
            const tips = [8,12,16,20];
            
            tips.forEach((tipIdx) => { 
                const d = Math.sqrt(
                    Math.pow(landmarks[tipIdx].x - landmarks[0].x, 2) + 
                    Math.pow(landmarks[tipIdx].y - landmarks[0].y, 2)
                );
                if(d < 0.25) folded++; 
            });
            
            const dPinch = Math.sqrt(
                Math.pow(landmarks[4].x - landmarks[8].x, 2) + 
                Math.pow(landmarks[4].y - landmarks[8].y, 2)
            );
            
            const isPinch = dPinch < 0.08;
            const isFist = folded >= 3; 
            const isOpen = !isFist && !isPinch;

            if (isPinch && currentState === STATE.SCATTER) {
                if (photoMeshes.length > 0) {
                    switchToZoom();
                    updateStatus("抓取照片: 聚焦回忆", "#ffd700");
                } else {
                    updateStatus("请先上传照片", "#aaa");
                }
            } else if (isFist) {
                if (currentState !== STATE.TREE) {
                    currentState = STATE.TREE;
                    zoomTargetIndex = -1;
                    rotationVelocity.x = 0;
                    rotationVelocity.y = 0;
                    updateStatus("握拳: 聚合形态", "#0f0");
                }
            } else if (isOpen) {
                if (currentState === STATE.ZOOM) {
                    exitZoom();
                } else if (currentState === STATE.TREE) {
                    currentState = STATE.SCATTER;
                    lastHandPos.x = handPos.x;
                    lastHandPos.y = handPos.y;
                    updateStatus("张手: 星云散开 (挥手旋转)", "#00aaff");
                }
            }
        }

        function onWindowResize() {
            const dims = updateDimensions();
            camera.aspect = dims.width / dims.height;
            camera.updateProjectionMatrix();
            renderer.setSize(dims.width, dims.height);
            composer.setSize(dims.width, dims.height);

            const bufferSize = renderer.getDrawingBufferSize(new THREE.Vector2());
            maskTarget.setSize(
                Math.max(1, Math.round(bufferSize.x / 2)),
                Math.max(1, Math.round(bufferSize.y / 2))
            );
        }

        function loadImageFile(file) {
            return new Promise((resolve) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => { URL.revokeObjectURL(url); resolve({ img, file }); };
                img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
                img.src = url;
            });
        }

        document.getElementById('file-input').addEventListener('change', async (event) => {
            const files = Array.from(event.target.files || []);
            event.target.value = '';
            if (files.length === 0) return;

            const remaining = CONFIG.maxPhotos - photoMeshes.length;
            if (remaining <= 0) {
                updateStatus(`背景最多 ${CONFIG.maxPhotos} 张照片，刷新页面可重新选择`, '#ffa94d');
                return;
            }

            const selected = files.slice(0, remaining);
            const images = (await Promise.all(selected.map(loadImageFile))).filter(Boolean);
            images.forEach(({ img, file }) => addRingPhoto(img, file));
            if (images.length > 0) layoutRingPhotos();

            let msg = `已放置 ${photoMeshes.length} 张照片环绕背景`;
            if (selected.length < files.length) msg += `（上限 ${CONFIG.maxPhotos} 张）`;
            updateStatus(msg, '#fff');
        });

        if (window.location.protocol === 'file:') {
            document.getElementById('loading').textContent = '请通过本地服务器打开（见 README）';
            updateStatus('ES 模块需 http:// 或 https:// 访问', '#ffa94d');
        } else {
            initThree();
            animate();
        }
    </script>
</body>
